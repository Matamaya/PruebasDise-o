<!DOCTYPE html>
<html lang="es">
  <head>
    <style>
      .contenedor {
        /* Añade las propiedades de Flexbox aquí */
        display: flex;
        flex-direction: row;
        height: 300px; /* Fija la altura del contenedor */
      }
      .elemento {
        padding: 20px;
        background-color: lightgreen;
        border: 1px solid green;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="elemento">Elemento 1</div>
      <div class="elemento">Elemento 2</div>
      <div class="elemento">Elemento 3</div>
      <div class="elemento" style="align-self: flex-start">Elemento 4</div>
      <!-- Personalizado -->
    </div>
  </body>
</html>
