<!DOCTYPE html>
<html lang="es">
  <head>
    <style>
      .contenedor {
        display: flex;
        flex-direction: row; /* Prueba cambiar a column, row-reverse o column-reverse */
        background-color: lightgrey;
        padding: 20px;
        gap: 10px;
      }
      .elemento {
        background-color: lightblue;
        margin: 10px;
        padding: 20px;
        text-align: center;
        border: 2px solid blue;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="elemento">Elemento 1</div>
      <div class="elemento">Elemento 2</div>
      <div class="elemento">Elemento 3</div>
    </div>
  </body>
</html>
